[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tri-wizard-peg-trial"
version = "0.1.0"
description = "Vision-guided WidowX-250S peg sorting in MuJoCo"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
peg-sort = "peg_sorting.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: rendered MuJoCo and full episode tests"]
