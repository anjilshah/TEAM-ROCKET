name: Task 1 MuJoCo validation
on: [push, pull_request]
jobs:
  task1:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: TASK1_tri-wizard_peg_trial
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: TASK1_tri-wizard_peg_trial/requirements-lock.txt
      - run: sudo apt-get update && sudo apt-get install -y libegl1-mesa libgl1
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-lock.txt
      - run: .venv/bin/python -m pip install --no-build-isolation --no-deps -e .
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -m pytest -q
      - run: bash launch/run_autonomy.sh --headless --seed 1
