name: MuJoCo validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1-mesa libgl1
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: pytest -q
      - run: bash launch/run_autonomy.sh --headless --seed 1
